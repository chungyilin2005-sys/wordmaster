<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字測驗 App</title>
    <!-- 引入 React 和 Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 設定 Tailwind 樣式與字型 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 簡易圖示組件 (SVG) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            FileUp: (props) => <Icon {...props} path={<><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 12v6"/><path d="m9 15 3-3 3 3"/></>} />,
            Volume2: (props) => <Icon {...props} path={<><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></>} />,
            CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            XCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>} />,
            ChevronRight: (props) => <Icon {...props} path={<><polyline points="9 18 15 12 9 6"/></>} />,
            Trophy: (props) => <Icon {...props} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2l-7.95 8.95L2 2"/></>} />,
            RotateCcw: (props) => <Icon {...props} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Download: (props) => <Icon {...props} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
        };

        // --- 主應用程式 ---
        function App() {
            const [screen, setScreen] = useState('start'); 
            const [words, setWords] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [mistakes, setMistakes] = useState([]);
            const [showExplanation, setShowExplanation] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [voice, setVoice] = useState(null);

            // 載入語音
            useEffect(() => {
                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    const bestVoice = voices.find(v => v.name.includes('Microsoft') && v.name.includes('Online (Natural)') && v.lang.includes('en-US')) 
                                || voices.find(v => v.name.includes('Google US English'))
                                || voices.find(v => v.lang === 'en-US');
                    setVoice(bestVoice);
                };
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }, []);

            // 題目變更時重置選項
            useEffect(() => {
                if (words.length > 0 && currentIndex < words.length) {
                    const currentWord = words[currentIndex];
                    setShuffledOptions([...currentWord.options].sort(() => Math.random() - 0.5));
                    setSelectedOption(null);
                    setShowExplanation(false);
                }
            }, [currentIndex, words]);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const json = JSON.parse(e.target.result);
                            if (Array.isArray(json)) startQuiz(json);
                            else alert('JSON 格式錯誤：必須是陣列');
                        } catch (error) {
                            alert('無法解析檔案');
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const startQuiz = (data) => {
                setWords([...data].sort(() => Math.random() - 0.5));
                setCurrentIndex(0);
                setScore(0);
                setMistakes([]);
                setScreen('quiz');
            };

            const speak = (text) => {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/\*\*/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                if (voice) utterance.voice = voice;
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            };

            const handleOptionClick = (option) => {
                if (selectedOption) return;
                setSelectedOption(option);
                const currentWord = words[currentIndex];
                const isCorrect = option === currentWord.correctAnswer;
                if (isCorrect) setScore(prev => prev + 1);
                else setMistakes(prev => [...prev, currentWord]);
                setShowExplanation(true);
                speak(currentWord.word);
            };

            const nextQuestion = () => {
                if (currentIndex < words.length - 1) setCurrentIndex(prev => prev + 1);
                else setScreen('result');
            };

            const exportMistakes = () => {
                if (mistakes.length === 0) return;
                const blob = new Blob([JSON.stringify(mistakes, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mistakes_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const renderWord = (text) => {
                const parts = text.split(/(\*\*.*?\*\*|\s+)/).filter(Boolean);
                return (
                    <div className="flex flex-wrap justify-center gap-1 text-3xl font-bold text-gray-800 mb-4">
                        {parts.map((part, idx) => {
                            const isBold = part.startsWith('**') && part.endsWith('**');
                            const content = part.replace(/\*\*/g, '');
                            if (/^\s+$/.test(part)) return <span key={idx}>&nbsp;</span>;
                            return (
                                <span 
                                    key={idx}
                                    onClick={() => window.open(`https://dictionary.cambridge.org/zht/詞典/英語-漢語-繁體/${content.replace(/[^a-zA-Z]/g, '')}`, '_blank')}
                                    className={`cursor-pointer transition-colors hover:text-blue-600 ${isBold ? 'text-red-600 underline decoration-2 underline-offset-4' : ''}`}
                                >
                                    {content}
                                </span>
                            );
                        })}
                    </div>
                );
            };

            // 畫面渲染邏輯
            if (screen === 'start') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl text-center fade-in">
                            <div className="bg-blue-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                                <Icons.BookOpen className="w-10 h-10 text-blue-600" />
                            </div>
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">英文單字測驗</h1>
                            <p className="text-slate-500 mb-8">上傳 JSON 檔案開始練習</p>
                            <label className="block w-full cursor-pointer group">
                                <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                                <div className="bg-blue-600 text-white py-4 px-6 rounded-xl font-semibold shadow-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-2 transform active:scale-95">
                                    <Icons.FileUp className="w-5 h-5" />
                                    選擇單字檔案
                                </div>
                            </label>
                        </div>
                    </div>
                );
            }

            if (screen === 'result') {
                const accuracy = Math.round((score / words.length) * 100);
                return (
                    <div className="min-h-screen p-4 flex flex-col items-center">
                        <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden fade-in">
                            <div className="bg-blue-600 p-8 text-center text-white">
                                <div className="flex justify-center mb-4"><Icons.Trophy className="w-16 h-16 opacity-90" /></div>
                                <h2 className="text-3xl font-bold mb-2">測驗完成！</h2>
                                <div className="text-blue-100">正確率</div>
                                <div className="text-5xl font-bold mt-2">{accuracy}%</div>
                            </div>
                            <div className="p-6 space-y-3">
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div className="bg-slate-50 p-4 rounded-xl text-center"><div className="text-sm text-slate-500">總題數</div><div className="text-2xl font-bold">{words.length}</div></div>
                                    <div className="bg-slate-50 p-4 rounded-xl text-center"><div className="text-sm text-slate-500">得分</div><div className="text-2xl font-bold">{score}</div></div>
                                </div>
                                <button onClick={() => setScreen('start')} className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors">
                                    <Icons.RotateCcw className="w-5 h-5" /> 回到主畫面
                                </button>
                                {mistakes.length > 0 && (
                                    <>
                                        <button onClick={() => startQuiz(mistakes)} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors shadow-md">
                                            <Icons.AlertCircle className="w-5 h-5" /> 重做錯題 ({mistakes.length})
                                        </button>
                                        <button onClick={exportMistakes} className="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors shadow-md">
                                            <Icons.Download className="w-5 h-5" /> 導出錯題 JSON
                                        </button>
                                        <div className="mt-6">
                                            <h3 className="text-lg font-bold text-slate-800 mb-3 border-l-4 border-red-500 pl-3">錯誤清單</h3>
                                            <div className="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                                {mistakes.map((m, i) => (
                                                    <div key={i} className="bg-red-50 p-3 rounded-lg border border-red-100 text-sm">
                                                        <div className="font-bold text-red-800 mb-1">{m.word.replace(/\*\*/g, '')}</div>
                                                        <div className="text-red-600">正解: {m.correctAnswer}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            const currentWord = words[currentIndex];
            const progress = ((currentIndex + 1) / words.length) * 100;

            return (
                <div className="min-h-screen p-4 flex flex-col items-center justify-center">
                    <div className="w-full max-w-lg mb-4 flex justify-between items-center text-sm font-medium text-slate-500">
                        <span>題目 {currentIndex + 1} / {words.length}</span>
                        <span>分數: {score}</span>
                    </div>
                    <div className="w-full max-w-lg h-2 bg-slate-200 rounded-full mb-6 overflow-hidden">
                        <div className="h-full bg-blue-500 transition-all duration-300 ease-out" style={{ width: `${progress}%` }}></div>
                    </div>
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col fade-in">
                        <div className="p-8 pb-4 text-center border-b border-slate-100 relative">
                            <button onClick={() => speak(currentWord.word)} className="absolute top-4 right-4 p-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 transition-colors">
                                <Icons.Volume2 className="w-6 h-6" />
                            </button>
                            <div className="mt-4">
                                {renderWord(currentWord.word)}
                                <div className="text-slate-400 text-sm">點擊單字可查詢字典</div>
                            </div>
                        </div>
                        <div className="p-6 bg-slate-50">
                            <div className="grid grid-cols-1 gap-3">
                                {shuffledOptions.map((option, idx) => {
                                    let btnClass = "w-full p-4 rounded-xl text-left font-medium transition-all transform active:scale-98 border-2 ";
                                    if (selectedOption) {
                                        if (option === currentWord.correctAnswer) btnClass += "bg-green-100 border-green-500 text-green-800";
                                        else if (option === selectedOption) btnClass += "bg-red-100 border-red-500 text-red-800";
                                        else btnClass += "bg-white border-transparent opacity-50";
                                    } else {
                                        btnClass += "bg-white border-transparent shadow-sm hover:border-blue-300 hover:shadow-md text-slate-700";
                                    }
                                    return (
                                        <button key={idx} onClick={() => handleOptionClick(option)} disabled={!!selectedOption} className={btnClass}>
                                            <div className="flex items-center justify-between">
                                                <span>{option}</span>
                                                {selectedOption && option === currentWord.correctAnswer && <Icons.CheckCircle className="w-5 h-5 text-green-600" />}
                                                {selectedOption && option === selectedOption && option !== currentWord.correctAnswer && <Icons.XCircle className="w-5 h-5 text-red-600" />}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                        {showExplanation && (
                            <div className="p-6 bg-blue-50 border-t border-blue-100 fade-in">
                                <div className="mb-4">
                                    <h4 className="font-bold text-blue-800 mb-1 flex items-center gap-2"><Icons.BookOpen className="w-4 h-4" /> 解析</h4>
                                    <p className="text-blue-900 text-sm leading-relaxed">{currentWord.explanation}</p>
                                </div>
                                <button onClick={nextQuestion} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 transition-all">
                                    {currentIndex < words.length - 1 ? '下一題' : '查看結果'} <Icons.ChevronRight className="w-5 h-5" />
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
